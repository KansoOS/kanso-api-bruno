info:
  name: Me
  type: http
  seq: 5

http:
  method: GET
  url: "{{host}}/v1/me"
  body:
    type: form-urlencoded
    data:
      - name: email
        value: test@test.test
      - name: password
        value: test1234
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
