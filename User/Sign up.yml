info:
  name: Sign up
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/v1/auth/signup"
  body:
    type: form-urlencoded
    data:
      - name: email
        value: test@test.test
      - name: password
        value: test1234
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
