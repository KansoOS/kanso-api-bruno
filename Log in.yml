info:
  name: Log in
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/v1/auth/login"
  body:
    type: form-urlencoded
    data:
      - name: email
        value: test@test.test
      - name: password
        value: test1234
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.accessToken
        method: jsonq
      variable:
        name: accessToken
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.mfaToken
        method: jsonq
      variable:
        name: mfaToken
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
