info:
  name: Create mandat
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/v1/spaces/{{spaceId}}/mandate"
  body:
    type: form-urlencoded
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: spaceId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
